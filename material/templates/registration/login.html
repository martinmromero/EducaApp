{% load static message_tags %}<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Iniciar sesión - EducaApp</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/favicon-16.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
    <script>
      // Mismo criterio que base.html: aplica el tema oscuro antes de pintar
      // CSS, para no mostrar un flash de tema claro al recargar.
      (function () {
        try {
          if (localStorage.getItem('mode') === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-wrap {
            width: 100%;
            max-width: 380px;
        }
        .login-logo {
            width: 108px;
            height: 108px;
            object-fit: contain;
        }
        .login-brand {
            font-size: 2rem;
            font-weight: 700;
            margin-top: .5rem;
            letter-spacing: -.02em;
        }
        .login-card {
            border-radius: 1rem;
        }
        #loginSubmitBtn {
            margin-top: .5rem;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="text-center mb-4">
            <img src="{% static 'icons/icon-192.png' %}" alt="EducaApp" class="login-logo">
            <div class="login-brand">EducaApp</div>
        </div>

        <div class="card login-card shadow-sm">
            <div class="card-body p-4">
                {% show_messages "general" %}
                {% if form.errors %}
                <div class="alert alert-danger">
                    Usuario o contraseña incorrectos. Intentar de nuevo.
                </div>
                {% endif %}

                <form method="POST" action="{% url 'login' %}" id="loginForm">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuario</label>
                        <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg" id="loginSubmitBtn">
                            <span id="loginBtnText">Ingresar</span>
                            <span class="spinner-border spinner-border-sm ms-2 d-none" id="loginSpinner" role="status" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'password_reset_request' %}" class="small">¿Olvidó su contraseña?</a>
                </div>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="{% url 'material:signup' %}" class="btn btn-outline-secondary">Registrarse</a>
        </div>
    </div>

    <script>
        // Sin esto no se nota que el login está procesando (el POST puede
        // tardar un instante) — deshabilita el botón y muestra un spinner
        // apenas se envía el formulario.
        document.getElementById('loginForm').addEventListener('submit', function () {
            document.getElementById('loginSubmitBtn').disabled = true;
            document.getElementById('loginSpinner').classList.remove('d-none');
            document.getElementById('loginBtnText').textContent = 'Ingresando…';
        });
    </script>
</body>
</html>
