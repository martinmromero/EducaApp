{% load static %}<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Nueva contraseña - EducaApp</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/favicon-16.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
    <script>
      (function () {
        try {
          if (localStorage.getItem('mode') === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-wrap { width: 100%; max-width: 380px; }
        .login-logo { width: 108px; height: 108px; object-fit: contain; }
        .login-brand { font-size: 2rem; font-weight: 700; margin-top: .5rem; letter-spacing: -.02em; }
        .login-card { border-radius: 1rem; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="text-center mb-4">
            <img src="{% static 'icons/icon-192.png' %}" alt="EducaApp" class="login-logo">
            <div class="login-brand">EducaApp</div>
        </div>

        <div class="card login-card shadow-sm">
            <div class="card-body p-4">
                <h5 class="mb-3 text-center">Definir nueva contraseña</h5>

                {% if errors %}
                <div class="alert alert-danger">
                    <ul class="mb-0 ps-3">
                        {% for e in errors %}<li>{{ e }}</li>{% endfor %}
                    </ul>
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="new_password1" class="form-label">Contraseña nueva</label>
                        <input type="password" name="new_password1" id="new_password1" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="new_password2" class="form-label">Confirmar contraseña nueva</label>
                        <input type="password" name="new_password2" id="new_password2" class="form-control" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Guardar contraseña</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
