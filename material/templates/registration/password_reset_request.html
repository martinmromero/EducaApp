{% load static %}<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Recuperar contraseña - EducaApp</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/favicon-16.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
    <script>
      (function () {
        try {
          if (localStorage.getItem('mode') === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fonts/fonts.css' %}">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-wrap { width: 100%; max-width: 380px; }
        .login-logo { width: 108px; height: 108px; object-fit: contain; }
        .login-brand { font-size: 2rem; font-weight: 700; margin-top: .5rem; letter-spacing: -.02em; }
        .login-card { border-radius: 1rem; }
        #resetSubmitBtn { margin-top: .5rem; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="text-center mb-4">
            <img src="{% static 'icons/icon-192.png' %}" alt="EducaApp" class="login-logo">
            <div class="login-brand">EducaApp</div>
        </div>

        <div class="card login-card shadow-sm">
            <div class="card-body p-4">
                <h5 class="mb-3 text-center">Recuperar contraseña</h5>
                <p class="text-muted small text-center">Ingresar el usuario para responder la pregunta de seguridad configurada.</p>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post" id="resetRequestForm">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" name="username" id="username" class="form-control" required autofocus>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg" id="resetSubmitBtn">Continuar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="btn btn-outline-secondary">Volver a iniciar sesión</a>
        </div>
    </div>
</body>
</html>
