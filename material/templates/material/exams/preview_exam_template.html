{% extends 'material/exams/base_exam_preview.html' %}

{% block title %}{% if template_name %}{{ template_name }} - Plantilla{% else %}Plantilla de Examen{% endif %}{% endblock %}

{% block action_buttons %}
<button onclick="window.print()">
    <i class="bi bi-printer"></i> Imprimir Examen
</button>
{% if template_id %}
<a href="{% url 'material:create_exam' %}?plantilla_id={{ template_id }}">
    <button class="secondary">
        <i class="bi bi-file-earmark-plus"></i> Crear examen con esta plantilla
    </button>
</a>
{% endif %}
<button onclick="examPreviewGoBack('{{ back_url|escapejs }}')" class="secondary">
    <i class="bi bi-arrow-left"></i> Volver
</button>
{% endblock %}
