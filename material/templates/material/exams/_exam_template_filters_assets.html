{% comment %}
CSS/JS compartidos por los filtros de columna (dropdown desktop + offcanvas mobile)
de la tabla de plantillas. Incluir una sola vez por página.
{% endcomment %}
<style>
    .column-filter-toggle {
        border: none;
        background: transparent;
        color: #6c757d;
        padding: .1rem .35rem;
        line-height: 1;
    }
    .column-filter-toggle:hover,
    .column-filter-toggle:focus {
        color: #0d6efd;
    }
    .column-filter-toggle.active {
        color: #0d6efd;
    }
    .column-filter-menu {
        min-width: 220px;
        max-width: 280px;
        /* Sin max-height/scroll propio: el menu crece lo que haga falta para
           mostrar todas las opciones. Si no entra en la ventana, se scrollea
           la pagina (ver .table-responsive.filter-dropdown-open mas abajo). */
    }
    /* Mientras hay un dropdown de columna abierto, el contenedor con scroll
       horizontal de la tabla deja de recortar verticalmente para que el menu
       no quede cortado por el borde de la tabla. */
    .table-responsive.filter-dropdown-open {
        overflow: visible;
    }
    th.filterable-col {
        white-space: nowrap;
    }
    .active-filters-summary {
        min-height: 1px;
    }
    .active-filters-summary .badge {
        cursor: pointer;
    }
    /* Los íconos de filtro por columna arrancan ocultos siempre: en mobile porque son
       incómodos con el scroll horizontal (se usa el offcanvas), en desktop porque
       ensucian el header hasta que el usuario toca "Filtros". */
    .column-filter-dropdown {
        display: none;
    }
    @media (min-width: 768px) {
        .exam-template-table.filters-visible .column-filter-dropdown {
            display: inline-block;
        }
        .mobile-filters-trigger {
            display: none;
        }
    }
    @media (max-width: 767.98px) {
        .desktop-filters-trigger {
            display: none;
        }
    }
    .exam-template-filters-offcanvas {
        height: 85vh;
    }
    .exam-template-filters-offcanvas .offcanvas-body {
        padding-bottom: 0;
    }
</style>
<script>
    function clearColumnFilter(field) {
        document.querySelectorAll('input[form="templateFiltersForm"][name="' + field + '"]').forEach(function (cb) {
            cb.checked = false;
        });
        document.getElementById('templateFiltersForm').submit();
    }

    function clearAllColumnFilters() {
        document.querySelectorAll('input[form="templateFiltersForm"][type="checkbox"]').forEach(function (cb) {
            cb.checked = false;
        });
        document.getElementById('templateFiltersForm').submit();
    }

    function toggleDesktopColumnFilters(btn) {
        const table = document.querySelector('.exam-template-table');
        if (!table) return;
        const visible = table.classList.toggle('filters-visible');
        btn.classList.toggle('active', visible);
        btn.innerHTML = visible
            ? '<i class="fas fa-filter"></i> Ocultar filtros'
            : '<i class="fas fa-filter"></i> Filtros';
    }

    // La tabla vive dentro de .table-responsive (overflow-x:auto para el scroll
    // horizontal en pantallas angostas), lo que de paso recorta verticalmente
    // cualquier dropdown que sobresalga. Mientras un dropdown de columna esta
    // abierto, se desactiva ese recorte para que el menu pueda mostrar todas
    // las opciones sin scroll propio (la pagina scrollea si hace falta).
    document.addEventListener('show.bs.dropdown', function (event) {
        const toggle = event.target;
        if (!toggle.classList || !toggle.classList.contains('column-filter-toggle')) return;
        const scrollParent = toggle.closest('.table-responsive');
        if (scrollParent) scrollParent.classList.add('filter-dropdown-open');
    });
    document.addEventListener('hidden.bs.dropdown', function (event) {
        const toggle = event.target;
        if (!toggle.classList || !toggle.classList.contains('column-filter-toggle')) return;
        const scrollParent = toggle.closest('.table-responsive');
        if (scrollParent) scrollParent.classList.remove('filter-dropdown-open');
    });
</script>
