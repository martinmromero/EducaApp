services:
  - type: web
    name: educaapp
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput --clear
      python manage.py migrate
      python manage.py clean_seed_subjects
      python manage.py seed_demo_content
      python manage.py seed_test_checklist
      python manage.py ensure_training_spare_pool
      python manage.py createsuperuser --noinput || true
    startCommand: python manage.py migrate --noinput && gunicorn educaapp.wsgi --workers 1 --threads 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: educaapp.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: educaapp-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /health/
